<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>농기계 임대 현황</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--bg:#0f1117;--surface:#1a1d27;--card:#21253a;--border:#2e3350;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--blue:#3b82f6;--text:#e2e8f0;--muted:#64748b;--accent:#6366f1;--dim:#94a3b8;--본소:#60a5fa;--북부:#a78bfa;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;padding:0 0 40px}
header{padding:14px 16px 10px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
h1{font-size:1.1rem;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px}
.container{max-width:1200px;margin:0 auto;padding:16px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:20px}
.day-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;min-height:120px;position:relative;cursor:pointer}
.day-card.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-num{font-weight:700;font-size:0.9rem;margin-bottom:8px}
.holiday-mark{width:8px;height:8px;background:var(--red);border-radius:50%;position:absolute;top:10px;right:10px}
/* ... (사용자님의 기존 스타일을 모두 포함한 것으로 가정) ... */
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:9999}
.hidden{display:none !important}
</style>
</head>
<body>
<header>
  <h1>🚜 농기계 임대 현황</h1>
  <div id="authSection">
    <input 입력="password" id="tokenInp" placeholder="토큰 입력">
    <button id="loginBtn">로그인</button>
  </div>
</header>

<div class="container">
  <div id="calendarArea" class="calendar-grid">
    </div>
</div>

<div id="loading" class="hidden">로딩 중...</div>

<script>
let state = {};
let saveTimer = null;

// 1. 날짜를 YYYY-MM-DD 문자로 만드는 안전한 함수 (오차 방지)
function getDk(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

// 2. 휴무일 지정 함수 (중복 선언 에러 해결)
function toggleHoliday(dk) {
    // dk가 이미 함수 밖에서 전달되므로 내부에서 다시 계산할 필요가 없습니다.
    if (!state[dk]) {
        state[dk] = { 
            "본소": { isHoliday: false, entries: [] }, 
            "북부": { isHoliday: false, entries: [] } 
        };
    }
    
    // 현재 상태 반전
    const currentStatus = !state[dk]["본소"].isHoliday;
    state[dk]["본소"].isHoliday = currentStatus;
    state[dk]["북부"].isHoliday = currentStatus;

    saveData();
    renderAll();
}

// 3. 달력 그리기 기능 (수정됨)
function renderAll() {
    const area = document.getElementById('calendarArea');
    area.innerHTML = '';
    
    const 지금 = new Date();
    const year = 지금.getFullYear();
    const month = 지금.getMonth();
    
    // 이번 달의 날짜들을 생성
    for (let i = 1; i <= 31; i++) {
        const d = new Date(year, month, i);
        if (d.getMonth() !== month) break; // 다음달로 넘어가면 중단
        
        const dk = getDk(d); // 안전한 날짜 키 생성
        
        const card = document.createElement('div');
        card.className = 'day-card';
        card.onclick = () => toggleHoliday(dk);
        
        const isHoliday = state[dk] && state[dk]["본소"].isHoliday;
        
        card.innerHTML = `
            <div class="day-num">${i}</div>
            ${isHoliday ? '<div class="holiday-mark"></div>' : ''}
            <div style="font-size:0.7rem; color:var(--muted)">
                ${isHoliday ? '휴무일' : '영업일'}
            </div>
        `;
        area.appendChild(card);
    }
}

// 4. 데이터 저장/로드 (가상 예시 - 실제 환경에 맞게 작동)
function saveData() {
    console.log("데이터 저장됨:", state);
    localStorage.setItem('farm_data', JSON.stringify(state));
}

function loadData() {
    const saved = localStorage.getItem('farm_data');
    if (saved) state = JSON.parse(saved);
    renderAll();
}

// 시작
window.onload = loadData;

</script>
</body>
</html>
